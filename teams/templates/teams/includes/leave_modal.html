{% load i18n %}

<!-- Leave Confirmation Modal -->
<div id="leaveModal" class="hidden fixed inset-0 bg-scrim overflow-y-auto h-full w-full z-50 flex items-center justify-center">
    <div class="relative p-6 border border-edge w-96 shadow-lg rounded-md bg-surface">
        <div class="text-center m-4">
            <h3 class="text-2xl font-semibold text-ink mt-3 mb-4">{% translate "Leave Team" %}</h3>
            <div class="mt-4 mb-6">
                <p class="text-ink-dim">
                    {% translate "Are you sure you want to leave this team?" %}
                </p>
            </div>
            <div class="flex items-center justify-center space-x-4 mb-4">
                <button id="cancelLeave" class="text-accent font-bold">{% translate "Cancel" %}</button>
                <form method="post" action="." id="leaveForm">
                    {% csrf_token %}
                    <input type="hidden" name="action" id="leaveAction" value="">
                    <button type="submit" class="font-bold h-9 px-3 text-sm inline-flex items-center justify-center rounded-md bg-critical text-critical-ink border border-critical hover:brightness-110 active:ring-3">{% translate "Leave" %}</button>
                </form>
            </div>
        </div>
    </div>
</div>
