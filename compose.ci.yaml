services:
  test:
    build:
      context: .
      target: test
    environment:
      DJANGO_SETTINGS_MODULE: bugsink.settings.development
      DB: sqlite
      SAMPLES_DIR: /event-samples
    command: >
      sh -c "ruff check . &&
             python manage.py check &&
             python manage.py makemigrations --check &&
             python manage.py test"
