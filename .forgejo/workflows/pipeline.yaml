name: Continuous Integration and Deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: compose.ci.yaml
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check out event-samples (test fixtures)
        run: git clone --depth 1 https://github.com/bugsink/event-samples.git event-samples

      - name: Run lint and tests (sqlite)
        run: docker compose run --rm --no-deps test

  build:
    name: Build the production stack
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CONTAINER_REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.CONTAINER_REGISTRY_URL }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=registry,ref=${{ vars.CONTAINER_REGISTRY_URL }}/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=${{ vars.CONTAINER_REGISTRY_URL }}/${{ github.repository }}:buildcache,mode=max
