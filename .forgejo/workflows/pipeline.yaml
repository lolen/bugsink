name: Continuous Integration and Deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    container: python:3.12-slim
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: bugsink.settings.development
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements.development.txt

      - name: Check out event-samples (test fixtures)
        uses: actions/checkout@v4
        with:
          repository: bugsink/event-samples
          path: event-samples

      - name: Ruff
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      - name: Makemigrations --check
        run: python manage.py makemigrations --check

      - name: Run tests (sqlite)
        env:
          SAMPLES_DIR: ${{ github.workspace }}/event-samples
        run: python manage.py test

  build:
    name: Build the production stack
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CONTAINER_REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.CONTAINER_REGISTRY_URL }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=registry,ref=${{ vars.CONTAINER_REGISTRY_URL }}/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=${{ vars.CONTAINER_REGISTRY_URL }}/${{ github.repository }}:buildcache,mode=max
